<title>검사 기록지</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mute:#5d6675;--line:#d5d9e0;--accent:#2f5bd3;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--fg:#e6e9ee;--mute:#9aa3b2;
--line:#343a45;--accent:#7b9cff;--err:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);
color:var(--fg);
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);
border-radius:12px;padding:24px}
h1{font-size:18px;margin:0 0 6px}
p{margin:0 0 16px;color:var(--mute);font-size:14px}
input{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:8px;
background:var(--bg);color:var(--fg)}
button{margin-top:12px;width:100%;padding:10px;font:inherit;font-weight:600;border:0;border-radius:8px;
background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.5em;margin:10px 0 0;color:var(--err);font-size:14px}
</style></head>
<body>
<form id="f" autocomplete="off">

<div id="msg" role="alert"></div>
</form>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const raw = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.trim()),
    "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b(P.salt), iterations: P.iter, hash: "SHA-256"},
    raw, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b(P.iv)}, key, b(P.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), msg = document.getElementById("msg");
  go.disabled = true; msg.textContent = "";
  try {
    const html = await unlock(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch (err) {
    msg.textContent = window.crypto && crypto.subtle
      ? "비밀번호가 맞지 않습니다." : "이 브라우저에서는 열 수 없습니다(https 주소로 열어 주세요).";
    go.disabled = false;
  }
});
